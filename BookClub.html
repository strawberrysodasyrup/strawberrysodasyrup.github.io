<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍓 Book Club 🍓</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --pink: #ff6eb4;
      --pink2: #ff9ed2;
      --pink3: #ffc2e2;
      --white: #fff5f9;
      --card-bg: rgba(255,255,255,0.05);
      --card-bdr: rgba(255,110,180,0.25);
      --text: #fff0f7;
      --muted: #c490aa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(255,110,180,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 85% 80%, rgba(200,0,100,0.10) 0%, transparent 70%);
    }
    .hearts-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .hrt {
      position: absolute; opacity: 0;
      animation: floatHeart linear infinite;
      filter: drop-shadow(0 0 5px rgba(255,110,180,0.6));
    }
    @keyframes floatHeart {
      0%   { opacity: 0;    transform: translateY(105vh) rotate(-10deg); }
      8%   { opacity: 0.4; }
      92%  { opacity: 0.25; }
      100% { opacity: 0;    transform: translateY(-8vh) rotate(15deg); }
    }
    .page {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 50px 24px 90px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    .chars-top {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 4px; width: 100%;
      animation: fadeUp 0.6s ease both;
    }
    .chars-top img {
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(255,110,180,0.5));
      transition: transform 0.3s ease;
    }
    .chars-top img:hover { transform: translateY(-6px) scale(1.05); }
    .hero { text-align: center; animation: fadeUp 0.7s ease 0.1s both; }
    .hero-title {
      font-family: 'Pacifico', cursive;
      font-size: 2.7rem; line-height: 1.8;
      background: linear-gradient(130deg, #ff9ed2 0%, #ffffff 45%, #ff6eb4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px rgba(255,110,180,0.35));
    }
    .name-badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 18px; padding: 7px 22px; border-radius: 99px;
      background: rgba(255,110,180,0.10);
      border: 1px solid rgba(255,110,180,0.35);
      font-size: 0.88rem; font-weight: 800;
      color: var(--pink2); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .divider {
      display: flex; align-items: center; gap: 10px; width: 100%;
      font-size: 0.78rem; font-weight: 900; letter-spacing: 3px;
      color: var(--pink);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,110,180,0.4), transparent);
    }
    .heart-row {
      display: flex; gap: 8px; font-size: 1rem;
      animation: fadeUp 0.7s ease 0.15s both;
    }
    .heart-row span { color: var(--pink); animation: heartPulse 1.8s ease-in-out infinite; }
    .heart-row span:nth-child(2) { animation-delay: 0.2s; color: var(--pink2); }
    .heart-row span:nth-child(3) { animation-delay: 0.4s; color: var(--pink3); }
    .heart-row span:nth-child(4) { animation-delay: 0.6s; color: var(--pink2); }
    .heart-row span:nth-child(5) { animation-delay: 0.8s; color: var(--pink); }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .full-width { width: 100%; animation: fadeUp 0.7s ease 0.2s both; }

    .wheel-chart-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      align-items: stretch;
    }

    .genre-picker-card {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 20px;
      padding: 18px 16px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }
    .genre-tile {
      border: 1px solid rgba(255,110,180,0.25);
      border-radius: 12px;
      padding: 9px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.3px;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      transition: all 0.18s ease;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      line-height: 1.2;
    }
    .genre-tile .tile-emoji { font-size: 1.1rem; }
    .genre-tile:hover {
      background: rgba(255,110,180,0.12);
      border-color: rgba(255,110,180,0.5);
      color: var(--pink2);
      transform: translateY(-2px);
    }
    .genre-tile.selected {
      background: rgba(255,110,180,0.22);
      border-color: var(--pink);
      color: var(--pink2);
      box-shadow: 0 0 14px rgba(255,110,180,0.25);
    }
    .genre-tile.selected .tile-emoji { animation: popIn 0.25s ease; }
    @keyframes popIn { 0% { transform: scale(0.7); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

    .pick-btn {
      padding: 7px 22px; font-size: 0.82rem; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      background: rgba(255,110,180,0.12);
      border: 1px solid rgba(255,110,180,0.5);
      border-radius: 99px; cursor: pointer; color: var(--pink2);
      transition: all 0.2s; letter-spacing: 0.5px;
    }
    .pick-btn:hover { background: rgba(255,110,180,0.22); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,110,180,0.2); }
    #result-badge {
      font-family: 'Pacifico', cursive; font-size: 0.9rem;
      color: var(--pink2); min-height: 24px; text-align: center;
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 20px;
      padding: 16px 14px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
    }
    .chart-card canvas#genreChart {
      width: 120px !important;
      height: 120px !important;
      flex-shrink: 0;
    }
    .chart-legend { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Book grid — 4 cols desktop, 3 cols mobile */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
    }
    @media (max-width: 500px) {
      .books-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }

    .book-card { transition: border-color 0.3s ease; display: flex; flex-direction: column; }
    .book-card:hover { border-color: rgba(255,110,180,0.6); }
    .book-cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; border: 1px solid var(--card-bdr); border-radius: 16px; overflow: hidden;}
    .book-info {
      position: absolute; inset: 0;
      padding: 14px 12px 14px;
      background: linear-gradient(transparent 15%, rgba(0,0,0,0.88) 52%, #000 100%);
      display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
      opacity: 0; transition: opacity 0.28s ease; pointer-events: none;
    }
    .book-card:hover .book-info { opacity: 1; }
    .book-title  { font-size: 0.82rem; font-weight: 900; color: var(--white); line-height: 1.2; }
    .book-author { font-size: 0.68rem; color: var(--muted); margin-bottom: 1px; }
    .genre-tag   { font-size: 0.6rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; letter-spacing: 0.3px; display: inline-block; }
    .book-dates  { font-size: 0.6rem; color: var(--pink3); opacity: 0.8; margin-top: 2px; }
    .book-scores { padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 3px; }
    .avg-line    { align-items: center; gap: 6px; text-align: center; }
    .avg-stars   { font-size: 0.82rem; color: var(--pink3); text-align: center; }

    @media (max-width: 500px) {
      .book-scores { padding: 4px 6px 6px; }
      .avg-stars { font-size: 0.7rem; }
    }

    .backlog-card {
      background: var(--card-bg); border: 1px solid var(--card-bdr);
      border-radius: 20px; overflow: hidden; backdrop-filter: blur(12px);
    }
    .backlog-table { width: 100%; border-collapse: collapse; }
    .backlog-table th {
      font-size: 0.7rem; font-weight: 900; letter-spacing: 2px;
      color: var(--pink); text-transform: uppercase;
      padding: 12px 16px; text-align: left;
      border-bottom: 1px solid rgba(255,110,180,0.15);
    }
    .backlog-table td {
      padding: 10px 16px; font-size: 0.84rem; color: var(--text);
      border-bottom: 1px solid rgba(255,110,180,0.06);
      vertical-align: middle;
    }

    .tag-horror   { background: rgba(200,50,80,0.3);   color: #ff9eb5; }
    .tag-fantasy  { background: rgba(120,80,255,0.25);  color: #c4aaff; }
    .tag-mystery  { background: rgba(80,80,180,0.25);   color: #a0a8ff; }
    .tag-romance  { background: rgba(255,110,180,0.25); color: #ffaad6; }
    .tag-scifi    { background: rgba(0,180,220,0.2);    color: #7de8ff; }
    .tag-default  { background: rgba(255,110,180,0.15); color: var(--pink3); }

    .contacts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .pill {
      display: flex; align-items: center; gap: 9px; padding: 11px 22px; border-radius: 99px;
      background: var(--card-bg); border: 1px solid var(--card-bdr);
      text-decoration: none; color: var(--pink3); font-weight: 800; font-size: 0.88rem;
    }
    .pill svg { width: 17px; height: 17px; fill: currentColor; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="hearts-bg" id="hContainer"></div>

<div class="page">
  <div class="chars-top">
    <img src="https://media.tenor.com/JXn-34kLMaUAAAAj/pixel-heart.gif" alt="" style="height:30px"/>
    <img src="https://www.nicepng.com/png/full/419-4193239_kawaii-bunny-and-pink-image-pink-kawaii-png.png" alt="" style="height:90px; margin:0 8px"/>
    <img src="https://media.tenor.com/JXn-34kLMaUAAAAj/pixel-heart.gif" alt="" style="height:30px"/>
  </div>

  <div class="hero">
    <h1 class="hero-title">Book Club ♡</h1>
    <div class="name-badge">✿ &nbsp; angel & ashe's list &nbsp; ✿</div>
  </div>

  <div class="heart-row">
    <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
  </div>

  <div class="full-width">

    <div class="wheel-chart-col">
      <div class="genre-picker-card">
        <div class="genre-grid" id="genre-grid"></div>
        <button class="pick-btn" onclick="randomPick()">✦ random pick ✦</button>
        <div id="result-badge"></div>
      </div>
      <div class="chart-card">
        <div style="font-size:0.7rem;font-weight:900;letter-spacing:2px;color:var(--pink);text-align:center">chosen genres</div>
        <canvas id="genreChart"></canvas>
        <div class="chart-legend" id="chart-legend"></div>
      </div>
    </div>
  </div>

  <div class="full-width">
    <div class="divider" style="margin-bottom:20px;">♥ previously read ♥</div>
    <div class="books-grid" id="books-grid"></div>
  </div>

  <div class="full-width">
    <div class="divider" style="margin-bottom:20px;">♥ backlog ♥</div>
    <div class="backlog-card">
      <table class="backlog-table">
        <thead><tr><th>Name</th><th>Author</th><th>By</th><th>Genre</th></tr></thead>
        <tbody id="backlog-body"></tbody>
      </table>
    </div>
  </div>


<script>
const GENRES = [
  { name: "Classic",          emoji: "📖" },
  { name: "Horror",           emoji: "🩸" },
  { name: "Fantasy",          emoji: "🔮" },
  { name: "Romance",          emoji: "🌹" },
  { name: "Mystery",          emoji: "🕯️" },
  { name: "Science Fiction",  emoji: "🚀" },
  { name: "Thriller",         emoji: "🗡️" },
  { name: "Weird Girl Lit",   emoji: "🦋" },
  { name: "Historical Drama", emoji: "🏛️" },
];

const CHOSEN_BOOKS = [
  { title: "From Below", author: "Darcy Coates", genre: "Horror", coverUrl: "https://m.media-amazon.com/images/I/71hzPo8trqL._AC_UF1000,1000_QL80_.jpg", dateStart: "Jan 2, 2026", dateEnd: "Jan 23, 2026", scores: { angel: 4, ashe: 4.5 } },
  { title: "The Everlasting", author: "Alix E. Harrow", genre: "Fantasy", coverUrl: "https://m.media-amazon.com/images/I/81LbcMVpLPL._UF1000,1000_QL80_.jpg", dateStart: "Jan 26, 2026", dateEnd: "Feb 9, 2026", scores: { angel: 4, ashe: null } },
  { title: "Victorian Psycho", author: "Virginia Feito", genre: "Horror", coverUrl: "https://giuntialpunto.it/cdn/shop/files/9791281656413.1000.jpg?v=1763341430", dateStart: "Feb Something", dateEnd: "April 8, 2026", scores: { angel: 3.5, ashe: null } },
];

const BACKLOG = [
  { title: "Salvation Day", author: "Kali Wallace", suggestedBy: "angel", genre: "Horror" },
  { title: "Sister, Butcher, Sister", author: "K.D. Aldyn", suggestedBy: "ashe", genre: "Horror" },
  { title: "The Starving Saints", author: "Caitlin Starling", suggestedBy: "ashe", genre: "Horror" },
  { title: "The Butterfly Garden", author: "Dot Hutchison", suggestedBy: "ashe", genre: "Horror" },
  { title: "The Crimson Labyrinth", author: "Yusuke Kishi", suggestedBy: "ashe", genre: "Horror" },
];

const GENRE_TAG = { "Horror":"horror","Fantasy":"fantasy","Mystery":"mystery","Romance":"romance","Science Fiction":"scifi","Thriller":"thriller","Classic":"default","Weird Girl Lit":"default","Historical Drama":"default" };
const GENRE_COL = { "Horror":"#ff6eb4","Fantasy":"#c4aaff","Mystery":"#a0a8ff","Romance":"#ffaad6","Science Fiction":"#7de8ff","Thriller":"#ffb87a","Classic":"#ffe08a","Weird Girl Lit":"#7dffc4","Historical Drama":"#ffcb90" };

function renderGenreGrid() {
  document.getElementById('genre-grid').innerHTML = GENRES.map((g, i) => `
    <button class="genre-tile" id="tile-${i}" onclick="selectGenre(${i})">
      <span class="tile-emoji">${g.emoji}</span>
      <span>${g.name}</span>
    </button>
  `).join('');
}

function selectGenre(idx) {
  document.querySelectorAll('.genre-tile').forEach(t => t.classList.remove('selected'));
  document.getElementById('tile-' + idx).classList.add('selected');
  document.getElementById('result-badge').textContent = '✦ ' + GENRES[idx].name + ' ✦';
}

function randomPick() {
  selectGenre(Math.floor(Math.random() * GENRES.length));
}

function starsFor(val) {
  if (val === null || val === undefined) return '';
  return '★'.repeat(Math.floor(val)) + ((val % 1) >= 0.5 ? '☆' : '');
}
function avg(a, b) {
  if (a !== null && b !== null) return (a + b) / 2;
  return a !== null ? a : b;
}

function renderBooks() {
  document.getElementById('books-grid').innerHTML = CHOSEN_BOOKS.map(b => {
    const av2 = avg(b.scores.angel, b.scores.ashe);
    const scoresHtml = av2 !== null ? `<div class="book-scores"><div class="avg-line"><span class="avg-stars">${starsFor(av2)}</span></div></div>` : '';
    return `<div class="book-card"><div style="position:relative;"><img src="${b.coverUrl}" class="book-cover" loading="lazy" alt="${b.title}"/><div class="book-info"><div class="book-title">${b.title}</div><div class="book-author">${b.author}</div><span class="genre-tag tag-${GENRE_TAG[b.genre]||'default'}">${b.genre}</span><div class="book-dates">${b.dateStart} – ${b.dateEnd}</div></div></div>${scoresHtml}</div>`;
  }).join('');
}

function renderChart() {
  const counts = {};
  CHOSEN_BOOKS.forEach(b => { counts[b.genre] = (counts[b.genre]||0) + 1; });
  const labels = Object.keys(counts), data = Object.values(counts);
  const bgColors = labels.map(l => GENRE_COL[l] || "#ff9ed2");
  new Chart(document.getElementById('genreChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: bgColors, borderColor: '#0a0a0a', borderWidth: 2 }] },
    options: { cutout: '70%', plugins: { legend: { display: false } }, maintainAspectRatio: true }
  });
  document.getElementById('chart-legend').innerHTML = labels.map((l, i) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${bgColors[i]}"></div><span>${l}</span><span style="margin-left:auto;font-weight:800;">${data[i]}</span></div>`
  ).join('');
}

function renderBacklog() {
  document.getElementById('backlog-body').innerHTML = BACKLOG.map(b =>
    `<tr><td style="font-weight:700">${b.title}</td><td>${b.author}</td><td>${b.suggestedBy}</td><td><span class="genre-tag tag-${GENRE_TAG[b.genre]||'default'}">${b.genre}</span></td></tr>`
  ).join('');
}

const hc = document.getElementById('hContainer');
for (let i = 0; i < 15; i++) {
  const h = document.createElement('span');
  h.className = 'hrt'; h.textContent = '♥';
  h.style.cssText = `left:${Math.random()*100}vw;animation-duration:${10+Math.random()*10}s;animation-delay:${Math.random()*5}s;`;
  hc.appendChild(h);
}

renderGenreGrid();
renderChart();
renderBacklog();
renderBooks();
</script>
</body>
</html>
