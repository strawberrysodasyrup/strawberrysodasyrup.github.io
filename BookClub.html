<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🍓 Book Club 🍓</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --pink: #ff6eb4;
      --pink2: #ff9ed2;
      --pink3: #ffc2e2;
      --white: #fff5f9;
      --card-bg: rgba(255,255,255,0.05);
      --card-bdr: rgba(255,110,180,0.25);
      --text: #fff0f7;
      --muted: #c490aa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(255,110,180,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 85% 80%, rgba(200,0,100,0.10) 0%, transparent 70%);
    }
    .hearts-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .hrt {
      position: absolute; opacity: 0;
      animation: floatHeart linear infinite;
      filter: drop-shadow(0 0 5px rgba(255,110,180,0.6));
    }
    @keyframes floatHeart {
      0%   { opacity: 0;    transform: translateY(105vh) rotate(-10deg); }
      8%   { opacity: 0.4; }
      92%  { opacity: 0.25; }
      100% { opacity: 0;    transform: translateY(-8vh) rotate(15deg); }
    }
    .page {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 50px 24px 90px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }
    .chars-top {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 4px; width: 100%;
      animation: fadeUp 0.6s ease both;
    }
    .chars-top img {
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(255,110,180,0.5));
      transition: transform 0.3s ease;
    }
    .chars-top img:hover { transform: translateY(-6px) scale(1.05); }
    .hero { text-align: center; animation: fadeUp 0.7s ease 0.1s both; }
    .hero-title {
      font-family: 'Pacifico', cursive;
      font-size: 2.7rem; line-height: 1.8;
      background: linear-gradient(130deg, #ff9ed2 0%, #ffffff 45%, #ff6eb4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px rgba(255,110,180,0.35));
    }
    .name-badge {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 18px; padding: 7px 22px; border-radius: 99px;
      background: rgba(255,110,180,0.10);
      border: 1px solid rgba(255,110,180,0.35);
      font-size: 0.88rem; font-weight: 800;
      color: var(--pink2); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .divider {
      display: flex; align-items: center; gap: 10px; width: 100%;
      font-size: 0.78rem; font-weight: 900; letter-spacing: 3px;
      color: var(--pink);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,110,180,0.4), transparent);
    }
    .heart-row {
      display: flex; gap: 8px; font-size: 1rem;
      animation: fadeUp 0.7s ease 0.15s both;
    }
    .heart-row span { color: var(--pink); animation: heartPulse 1.8s ease-in-out infinite; }
    .heart-row span:nth-child(2) { animation-delay: 0.2s; color: var(--pink2); }
    .heart-row span:nth-child(3) { animation-delay: 0.4s; color: var(--pink3); }
    .heart-row span:nth-child(4) { animation-delay: 0.6s; color: var(--pink2); }
    .heart-row span:nth-child(5) { animation-delay: 0.8s; color: var(--pink); }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .full-width { width: 100%; animation: fadeUp 0.7s ease 0.2s both; }

    /* GENRE PICKER & CHART */
    .wheel-chart-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
      align-items: stretch;
    }


    .genre-picker-card {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 20px;
      padding: 18px 16px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .genre-grid-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }
    .genre-tile {
      border: 1px solid rgba(255,110,180,0.25);
      border-radius: 12px;
      padding: 9px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.68rem;
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.3px;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      transition: all 0.18s ease;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      line-height: 1.2;
    }
    .genre-tile .tile-emoji { font-size: 1.1rem; }
    .genre-tile:hover {
      background: rgba(255,110,180,0.12);
      border-color: rgba(255,110,180,0.5);
      color: var(--pink2);
      transform: translateY(-2px);
    }
    .genre-tile.selected {
      background: rgba(255,110,180,0.22);
      border-color: var(--pink);
      color: var(--pink2);
      box-shadow: 0 0 14px rgba(255,110,180,0.25);
    }

    .pick-btn {
      padding: 7px 22px; font-size: 0.82rem; font-weight: 800;
      font-family: 'Nunito', sans-serif;
      background: rgba(255,110,180,0.12);
      border: 1px solid rgba(255,110,180,0.5);
      border-radius: 99px; cursor: pointer; color: var(--pink2);
      transition: all 0.2s; letter-spacing: 0.5px;
    }
    .pick-btn:hover { background: rgba(255,110,180,0.22); transform: translateY(-2px); }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 20px;
      padding: 16px 14px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
    }
    .chart-card canvas#genreChart { width: 110px !important; height: 110px !important; }
    .chart-legend { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* PREVIOUSLY READ GRID */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
    }
    @media (max-width: 500px) {
      .books-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    .book-card { transition: border-color 0.3s ease; display: flex; flex-direction: column; }
    .book-cover { width: 100%; aspect-ratio: 2/3; object-fit: cover; border: 1px solid var(--card-bdr); border-radius: 16px; overflow: hidden; }
    .book-info {
      position: absolute; inset: 0;
      padding: 10px;
      background: linear-gradient(transparent 15%, rgba(0,0,0,0.9) 60%, #000 100%);
      display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
      opacity: 0; transition: opacity 0.28s ease; pointer-events: none;
    }
    .book-card:hover .book-info { opacity: 1; }
    .book-title  { font-size: 0.75rem; font-weight: 900; color: var(--white); }
    .book-author { font-size: 0.65rem; color: var(--muted); }
    .genre-tag   { font-size: 0.55rem; font-weight: 800; padding: 2px 6px; border-radius: 99px; display: inline-block; width: fit-content; }
    .avg-stars   { font-size: 0.75rem; color: var(--pink3); text-align: center; margin-top: 5px; }

    /* NEW BACKLOG GRID SYSTEM */
    .backlog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    @media (max-width: 500px) {
        .backlog-grid { grid-template-columns: 1fr; }
    }

    .backlog-section {
      background: var(--card-bg);
      border: 1px solid var(--card-bdr);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      height: fit-content;
      transition: all 0.3s ease;
    }

    .backlog-trigger {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--pink);
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .trigger-info { display: flex; align-items: center; gap: 8px; }
    .count-bubble {
        background: rgba(255,110,180,0.15);
        color: var(--pink2);
        padding: 2px 8px;
        border-radius: 8px;
        font-size: 0.65rem;
    }
    .backlog-chevron { font-size: 0.7rem; transition: transform 0.3s; opacity: 0.5; }

    .backlog-section.open .backlog-chevron { transform: rotate(180deg); }
    .backlog-section.open { border-color: var(--pink); background: rgba(255,110,180,0.03); }

    .backlog-drawer {
      display: none;
      padding: 0 12px 12px;
      animation: slideDown 0.3s ease;
    }
    .backlog-section.open .backlog-drawer { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .mini-table td {
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255,110,180,0.05);
      color: var(--text);
    }
    .mini-table tr:last-child td { border-bottom: none; }
    .mini-table .suggested-by { font-size: 0.65rem; color: var(--muted); text-align: right; }

    @media (max-width: 500px) {
        .mini-table { font-size: 0.72rem; }
    }

    /* GENRE TAGS */
    .tag-horror   { background: rgba(200,50,80,0.3);   color: #ff9eb5; }
    .tag-fantasy  { background: rgba(120,80,255,0.25);  color: #c4aaff; }
    .tag-mystery  { background: rgba(80,80,180,0.25);   color: #a0a8ff; }
    .tag-romance  { background: rgba(255,110,180,0.25); color: #ffaad6; }
    .tag-scifi    { background: rgba(0,180,220,0.2);    color: #7de8ff; }
    .tag-default  { background: rgba(255,110,180,0.15); color: var(--pink3); }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* If there is only one genre, make it take the full width */
.backlog-section:only-child {
  grid-column: 1 / -1;
}
  </style>
</head>
<body>

<div class="bg-glow"></div>
<div class="hearts-bg" id="hContainer"></div>

<div class="page">
  <div class="chars-top">
    <img src="https://media.tenor.com/JXn-34kLMaUAAAAj/pixel-heart.gif" alt="" style="height:30px"/>
    <img src="https://www.nicepng.com/png/full/419-4193239_kawaii-bunny-and-pink-image-pink-kawaii-png.png" alt="" style="height:90px; margin:0 8px"/>
    <img src="https://media.tenor.com/JXn-34kLMaUAAAAj/pixel-heart.gif" alt="" style="height:30px"/>
  </div>

  <div class="hero">
    <h1 class="hero-title">Book Club ♡</h1>
    <div class="name-badge">✿ &nbsp; angel & ashe's list &nbsp; ✿</div>
  </div>

  <div class="heart-row">
    <span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span>
  </div>

  <div class="full-width">
    <div class="wheel-chart-col">
      <div class="genre-picker-card">
        <div class="genre-grid-picker" id="genre-grid-picker"></div>
        <button class="pick-btn" onclick="randomPick()">✦ random pick ✦</button>
        <div id="result-badge" style="font-family:Pacifico; color:var(--pink2); font-size:0.9rem;"></div>
      </div>
      <div class="chart-card">
        <canvas id="genreChart"></canvas>
        <div class="chart-legend" id="chart-legend"></div>
      </div>
    </div>
  </div>

  <div class="full-width">
    <div class="divider" style="margin-bottom:20px;">♥ previously read ♥</div>
    <div class="books-grid" id="books-grid"></div>
  </div>

  <div class="full-width">
    <div class="divider" style="margin-bottom:20px;">♥ backlog ♥</div>
    <div class="backlog-grid" id="backlog-grid">
      </div>
  </div>
</div>

<script>
const GENRES = [
  { name: "Classic", emoji: "📖" },
  { name: "Horror", emoji: "🩸" },
  { name: "Fantasy", emoji: "🔮" },
  { name: "Romance", emoji: "🌹" },
  { name: "Mystery", emoji: "🕯️" },
  { name: "Science Fiction", emoji: "🚀" },
  { name: "Thriller", emoji: "🗡️" },
  { name: "Weird Girl Lit", emoji: "🦋" },
  { name: "Historical Drama", emoji: "🏛️" },
];

const CHOSEN_BOOKS = [
  { title: "From Below", author: "Darcy Coates", genre: "Horror", coverUrl: "https://m.media-amazon.com/images/I/71hzPo8trqL._AC_UF1000,1000_QL80_.jpg", dateStart: "Jan 2", dateEnd: "Jan 23", scores: { angel: 4, ashe: 4.5 } },
  { title: "The Everlasting", author: "Alix E. Harrow", genre: "Fantasy", coverUrl: "https://m.media-amazon.com/images/I/81LbcMVpLPL._UF1000,1000_QL80_.jpg", dateStart: "Jan 26", dateEnd: "Feb 9", scores: { angel: 5, ashe: 4.5 } },
  { title: "Victorian Psycho", author: "Virginia Feito", genre: "Horror", coverUrl: "https://giuntialpunto.it/cdn/shop/files/9791281656413.1000.jpg?v=1763341430", dateStart: "Feb", dateEnd: "April 8", scores: { angel: 3.5, ashe: 4 } },
];

const BACKLOG = [
  { title: "Salvation Day", author: "Kali Wallace", suggestedBy: "Angel", genre: "Horror" },
  { title: "Sister, Butcher, Sister", author: "K.D. Aldyn", suggestedBy: "Ashe", genre: "Horror" },
  { title: "The Butterfly Garden", author: "Dot Hutchison", suggestedBy: "Ashe", genre: "Horror" },
  { title: "The Crimson Labyrinth", author: "Yusuke Kishi", suggestedBy: "Ashe", genre: "Horror" },
  { title: "The Starving Saints", author: "Caitlin Starling", suggestedBy: "Ashe", genre: "Horror" },
  { title: "Dark Places", author: "Gillian Flynn", suggestedBy: "Angel", genre: "Mystery" },
  { title: "Dig", author: "J.H. Markert", suggestedBy: "Angel", genre: "Mystery" },
  { title: "How to Survive in the Woods", author: "Kat Rosenfield", suggestedBy: "Angel", genre: "Mystery" },
  { title: "You Did Nothing Wrong", author: "C.G. Drews", suggestedBy: "Angel", genre: "Mystery" },
  { title: "Bad Kids", author: "Zijin Chen", suggestedBy: "Ashe", genre: "Mystery" },
  { title: "Case Study", author: "Graeme Macrae Burnet", suggestedBy: "Ashe", genre: "Mystery" },
  { title: "End of Story", author: "A.J. Finn", suggestedBy: "Ashe", genre: "Mystery" },
  { title: "Havoc", author: "Christopher Bollen", suggestedBy: "Ashe", genre: "Mystery" },
  { title: "End of Story", author: "A.J. Finn", suggestedBy: "Ashe", genre: "Mystery" },
];

const GENRE_TAG = { "Horror":"horror","Fantasy":"fantasy","Mystery":"mystery","Romance":"romance","Science Fiction":"scifi","Thriller":"thriller","Classic":"default" };
const GENRE_COL = { "Horror":"#ff6eb4","Fantasy":"#c4aaff","Mystery":"#a0a8ff","Romance":"#ffaad6","Science Fiction":"#7de8ff","Thriller":"#ffb87a","Classic":"#ffe08a" };

function renderGenreGrid() {
  document.getElementById('genre-grid-picker').innerHTML = GENRES.map((g, i) => `
    <button class="genre-tile" id="tile-${i}" onclick="selectGenre(${i})">
      <span class="tile-emoji">${g.emoji}</span>
      <span>${g.name}</span>
    </button>
  `).join('');
}

function selectGenre(idx) {
  document.querySelectorAll('.genre-tile').forEach(t => t.classList.remove('selected'));
  document.getElementById('tile-' + idx).classList.add('selected');
  document.getElementById('result-badge').textContent = '✦ ' + GENRES[idx].name + ' ✦';
}

function randomPick() { selectGenre(Math.floor(Math.random() * GENRES.length)); }

function starsFor(val) {
  if (!val) return '';
  return '★'.repeat(Math.floor(val)) + ((val % 1) >= 0.5 ? '☆' : '');
}
function avg(a, b) {
  if (a !== null && b !== null) return (a + b) / 2;
  return a !== null ? a : b;
}
function renderBooks() {
  document.getElementById('books-grid').innerHTML = CHOSEN_BOOKS.map(b => {
    const av = (b.scores.angel + (b.scores.ashe || b.scores.angel)) / 2;
    return `
      <div class="book-card">
        <div style="position:relative;">
          <img src="${b.coverUrl}" class="book-cover" loading="lazy"/>
          <div class="book-info">
            <div class="book-title">${b.title}</div>
            <div class="book-author">${b.author}</div>
            <span class="genre-tag tag-${GENRE_TAG[b.genre]||'default'}">${b.genre}</span>
          </div>
        </div>
        <div class="avg-stars">${starsFor(av)}</div>
      </div>`;
  }).join('');
}

function renderChart() {
  const counts = {};
  CHOSEN_BOOKS.forEach(b => { counts[b.genre] = (counts[b.genre]||0) + 1; });
  const labels = Object.keys(counts), data = Object.values(counts);
  const bgColors = labels.map(l => GENRE_COL[l] || "#ff9ed2");
  new Chart(document.getElementById('genreChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: bgColors, borderColor: '#0a0a0a', borderWidth: 2 }] },
    options: { cutout: '70%', plugins: { legend: { display: false } }, maintainAspectRatio: true }
  });
  document.getElementById('chart-legend').innerHTML = labels.map((l, i) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${bgColors[i]}"></div><span>${l}</span><span style="margin-left:auto;font-weight:800;">${data[i]}</span></div>`
  ).join('');
}

function toggleBacklog(btn) {
  btn.parentElement.classList.toggle('open');
}

function renderBacklogGrid() {
  const grouped = BACKLOG.reduce((acc, book) => {
    if (!acc[book.genre]) acc[book.genre] = [];
    acc[book.genre].push(book);
    return acc;
  }, {});

  const grid = document.getElementById('backlog-grid');
  grid.innerHTML = Object.keys(grouped).map(genre => {
    const books = grouped[genre];
    const emoji = GENRES.find(g => g.name === genre)?.emoji || "📖";
    return `
      <div class="backlog-section">
        <button class="backlog-trigger" onclick="toggleBacklog(this)">
          <div class="trigger-info">
            <span>${emoji} ${genre}</span>
            <span class="count-bubble">${books.length}</span>
          </div>
          <span class="backlog-chevron">▼</span>
        </button>
        <div class="backlog-drawer">
          <table class="mini-table">
            ${books.map(b => `
              <tr>
                <td><b>${b.title}</b><br><span style="opacity:0.6; font-size:0.6rem;">${b.author}</span></td>
                <td class="suggested-by">via ${b.suggestedBy}</td>
              </tr>
            `).join('')}
          </table>
        </div>
      </div>
    `;
  }).join('');
}

// Background Hearts
const hc = document.getElementById('hContainer');
for (let i = 0; i < 15; i++) {
  const h = document.createElement('span');
  h.className = 'hrt'; h.textContent = '♥';
  h.style.cssText = `left:${Math.random()*100}vw;animation-duration:${10+Math.random()*10}s;animation-delay:${Math.random()*5}s;`;
  hc.appendChild(h);
}

renderGenreGrid();
renderChart();
renderBacklogGrid();
renderBooks();
</script>
</body>
</html>
