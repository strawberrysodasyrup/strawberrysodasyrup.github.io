<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✿ yourname.xyz</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Shrikhand&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --pink:    #f7c5d5;
      --pink2:   #f2a8c2;
      --lavender:#dfc6f5;
      --mint:    #b8ecd7;
      --peach:   #fddbb4;
      --sky:     #c2e4f7;
      --cream:   #fffaf5;
      --text:    #5a3e6b;
      --muted:   #9b7bb0;
      --card-bg: rgba(255,255,255,0.65);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--cream);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated gradient background ── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #fde8f0, #e8d8f8, #d6ecfb, #d6f5e8, #fde8c2);
      background-size: 400% 400%;
      animation: gradShift 14s ease infinite;
    }
    @keyframes gradShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating blobs ── */
    .blob {
      position: fixed; border-radius: 50%; filter: blur(60px);
      opacity: 0.35; z-index: 0; pointer-events: none;
      animation: blobFloat 8s ease-in-out infinite alternate;
    }
    .blob1 { width: 420px; height: 420px; background: var(--pink);    top: -100px; left: -80px;  animation-duration: 9s; }
    .blob2 { width: 320px; height: 320px; background: var(--lavender);bottom: -80px; right: -60px; animation-duration: 11s; }
    .blob3 { width: 240px; height: 240px; background: var(--mint);    top: 40%; left: 60%;      animation-duration: 7s; }
    @keyframes blobFloat {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-30px) scale(1.05); }
    }

    /* ── Floating star deco ── */
    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .star {
      position: absolute; font-size: 1.1rem; opacity: 0.18;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.10; transform: scale(0.9) rotate(0deg); }
      to   { opacity: 0.28; transform: scale(1.15) rotate(20deg); }
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      max-width: 680px; margin: 0 auto;
      padding: 56px 24px 80px;
      display: flex; flex-direction: column; align-items: center; gap: 40px;
    }

    /* ── Hero ── */
    .hero { text-align: center; animation: fadeUp 0.8s ease both; }
    .avatar {
      width: 110px; height: 110px; border-radius: 50%;
      background: linear-gradient(135deg, var(--pink2), var(--lavender));
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem; margin: 0 auto 18px;
      box-shadow: 0 8px 32px rgba(200,140,220,0.25);
      border: 4px solid white;
      animation: avatarPop 0.9s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes avatarPop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .hero h1 {
      font-family: 'Shrikhand', cursive;
      font-size: 2.6rem; color: var(--text);
      letter-spacing: 0.5px;
    }
    .hero .tagline {
      margin-top: 8px; color: var(--muted);
      font-size: 1rem; font-weight: 600;
    }
    .hero .tagline span { color: var(--pink2); }

    /* ── Section title ── */
    .section-label {
      font-family: 'Shrikhand', cursive;
      font-size: 1.15rem; color: var(--muted);
      letter-spacing: 1px; text-align: center;
      position: relative; width: 100%;
    }
    .section-label::before,
    .section-label::after {
      content: ''; display: inline-block;
      height: 2px; width: 48px;
      background: linear-gradient(90deg, transparent, var(--pink2));
      vertical-align: middle; margin: 0 12px;
    }
    .section-label::after { background: linear-gradient(90deg, var(--pink2), transparent); }

    /* ── Cards grid ── */
    .cards { width: 100%; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: 22px;
      padding: 22px 26px;
      display: flex; align-items: center; gap: 20px;
      text-decoration: none; color: inherit;
      box-shadow: 0 4px 24px rgba(180,130,210,0.10);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      animation: fadeUp 0.7s ease both;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 36px rgba(180,130,210,0.22);
      border-color: var(--pink2);
    }
    .card:nth-child(1) { animation-delay: 0.15s; }
    .card:nth-child(2) { animation-delay: 0.25s; }

    .card-icon {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem;
    }
    .card-icon.dice  { background: linear-gradient(135deg, #fddbb4, #f7c5d5); }
    .card-icon.save  { background: linear-gradient(135deg, #b8ecd7, #c2e4f7); }

    .card-body h2 { font-size: 1.1rem; font-weight: 800; }
    .card-body p  { font-size: 0.88rem; color: var(--muted); margin-top: 3px; line-height: 1.45; }

    .card-arrow {
      margin-left: auto; color: var(--pink2);
      font-size: 1.4rem; flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .card:hover .card-arrow { transform: translateX(4px); }

    /* ── Contact pills ── */
    .contacts { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    .contact-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 22px; border-radius: 99px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255,255,255,0.8);
      text-decoration: none; color: var(--text);
      font-weight: 700; font-size: 0.95rem;
      box-shadow: 0 4px 18px rgba(180,130,210,0.10);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      animation: fadeUp 0.7s ease both;
    }
    .contact-pill:nth-child(1) { animation-delay: 0.3s; }
    .contact-pill:nth-child(2) { animation-delay: 0.4s; }
    .contact-pill:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(180,130,210,0.2);
      background: rgba(255,255,255,0.9);
    }
    .contact-pill svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ── Footer ── */
    .footer {
      font-size: 0.82rem; color: var(--muted);
      text-align: center; animation: fadeUp 1s ease 0.5s both;
    }
    .footer span { color: var(--pink2); }

    /* ── Shared fade-up ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero { animation-delay: 0.05s; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .hero h1 { font-size: 2rem; }
      .card { padding: 18px 18px; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <!-- Scattered stars -->
  <div class="stars" id="stars"></div>

  <div class="page">

    <!-- Hero -->
    <div class="hero">
      <div class="avatar">🌸</div>
      <h1>yourname.xyz</h1>
      <p class="tagline">coder · creator · <span>chaos gremlin</span></p>
    </div>

    <!-- Projects -->
    <div class="section-label">✦ my projects ✦</div>

    <div class="cards">
      <a href="#" class="card">
        <div class="card-icon dice">🎲</div>
        <div class="card-body">
          <h2>Challenge Randomizer</h2>
          <p>Spin the wheel and let fate decide your next challenge ✨</p>
        </div>
        <span class="card-arrow">→</span>
      </a>

      <a href="#" class="card">
        <div class="card-icon save">💾</div>
        <div class="card-body">
          <h2>Save File Editor</h2>
          <p>Peek inside and tweak your save files with ease 🔧</p>
        </div>
        <span class="card-arrow">→</span>
      </a>
    </div>

    <!-- Contacts -->
    <div class="section-label">✦ find me ✦</div>

    <div class="contacts">
      <!-- Twitter / X -->
      <a href="https://twitter.com/yourhandle" class="contact-pill">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
        @yourhandle
      </a>

      <!-- Discord -->
      <a href="#" class="contact-pill">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        yourhandle
      </a>
    </div>

    <!-- Footer -->
    <p class="footer">made with <span>♡</span> and too much coffee</p>

  </div>

  <script>
    // Scatter little star/sparkle emojis across the bg
    const starEl = document.getElementById('stars');
    const symbols = ['✦','✧','⋆','·','✿','꩜','˚'];
    for (let i = 0; i < 38; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top  = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 5) + 's';
      s.style.animationDuration = (3 + Math.random() * 4) + 's';
      s.style.fontSize = (0.7 + Math.random() * 1.1) + 'rem';
      starEl.appendChild(s);
    }
  </script>
</body>
</html>
